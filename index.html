<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(to top, #5a00ff, #000111);
    font-family: 'Orbitron', Arial, sans-serif;
    color: white;
  }

  .container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  /* ANIMAÇÕES */

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-80px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(60px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  .profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;

    animation:
      pulseGlow 2.5s infinite ease-in-out,
      slideDown 1s ease;
  }

  @keyframes pulseGlow {
    0% {
      box-shadow: 0 0 10px #5a00ff, 0 0 20px #5a00ff;
    }

    50% {
      box-shadow: 0 0 25px #5a00ff, 0 0 40px #5a00ff;
    }

    100% {
      box-shadow: 0 0 10px #5a00ff, 0 0 20px #5a00ff;
    }
  }

  .Titulo {
  position: relative;
  display: inline-block;

  font-size: clamp(42px, 16vw, 58px);

  font-weight: 900;

  color: #d8d8d8;

  -webkit-text-stroke: 1.5px #0099ff;

  text-shadow:
    0 0 5px #0099ff,
    0 0 10px #0099ff,
    0 0 15px #0099ff;

  opacity: 0;
  animation: fadeIn 1s ease forwards;

  overflow: hidden;
}

/* Reflexo passando */

.Titulo::after {
  content: '';

  position: absolute;
  top: -20%;
  left: -120%;

  width: 50%;
  height: 260%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.9),
    transparent
  );

  transform: rotate(20deg);

  animation: shine 4s infinite;
}

@keyframes shine {
  0% {
    left: -120%;
  }

  20% {
    left: 130%;
  }

  100% {
    left: 130%;
  }
}

  .T2 {
    font-size: clamp(14px, 3vw, 20px);
    margin-bottom: 25px;

    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 0.3s;
  }

  .links-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 450px;
  }

  .btn {
    display: flex;
    align-items: center;

    width: 100%;
    padding: 12px 15px;

    background: white;
    color: black;
    text-decoration: none;
    font-weight: bold;
    border-radius: 999px;
    font-size: 14px;

    transition: all 0.3s ease;

    opacity: 0;
    animation: slideUp 0.8s ease forwards;
  }

  .btn:hover {
    background: #ddd;
    transform: scale(1.05);
  }

  .btn i {
    width: 22px;
    font-size: 18px;
    margin-right: 8px;
  }

  .links-grid .btn:nth-child(1) {
    animation-delay: 0.4s;
  }

  .links-grid .btn:nth-child(2) {
    animation-delay: 0.6s;
  }

  .links-grid .btn:nth-child(3) {
    animation-delay: 0.8s;
  }

  .links-grid .btn:nth-child(4) {
    animation-delay: 1s;
  }

  .links-grid .btn:nth-child(5) {
    animation-delay: 1.2s;
  }

  .links-grid .btn:nth-child(6) {
    animation-delay: 1.4s;
  }

  footer {
    text-align: center;
    padding: 15px;
    background-color: black;
    font-size: 14px;

    opacity: 0;
    animation: slideUp 1s ease forwards;
    animation-delay: 1.6s;
  }

  footer a {
    color: red;
    text-decoration: none;
  }

  @media (min-width: 768px) {
    body {
      background: linear-gradient(to right, #5a00ff, #000111);
    }
  }
</style>
